<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#e91e63" />
  <script>
    /* Apply the saved semantic theme before CSS/React to prevent a color flash. */
    (function () {
      try {
        var allowed = ['heritage', 'midnight', 'clarity', 'monochrome'];
        var saved = localStorage.getItem('astroroshni_theme');
        var configured = '%REACT_APP_DEFAULT_THEME%';
        var fallback = allowed.indexOf(configured) >= 0 ? configured : 'heritage';
        var theme = allowed.indexOf(saved) >= 0 ? saved : fallback;
        var colors = { heritage: '#210b17', midnight: '#100b17', clarity: '#265f56', monochrome: '#050505' };
        var colorSchemes = { heritage: 'light', midnight: 'dark', clarity: 'light', monochrome: 'light' };
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = colorSchemes[theme];
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', colors[theme]);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'heritage');
      }
    })();
  </script>
  <!-- Do NOT mark the marketing/CRA site as an installable web app.
       The only home-screen / PWA entry should be https://astroroshni.com/mobile/
       (Expo shell). Competing root installs open "/" and look like "the app opened the website". -->
  <meta name="mobile-web-app-capable" content="no" />
  <meta name="apple-mobile-web-app-capable" content="no" />
  <style>
    /* iOS keyboard / input fixes (still useful in mobile Safari browser tabs) */
    input, textarea, select {
      -webkit-user-select: text !important;
      -webkit-touch-callout: default !important;
    }
    
    /* Prevent zoom on input focus */
    input[type="text"], input[type="tel"], input[type="password"] {
      font-size: 16px !important;
    }
  </style>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- If an old/broken home-screen icon restores `/` (CRA), bounce standalone launches to the Expo PWA. -->
  <script>
    (function () {
      try {
        var path = location.pathname || '/';
        if (path.indexOf('/mobile') === 0) return;
        var standalone =
          (window.navigator && window.navigator.standalone === true) ||
          (window.matchMedia &&
            (window.matchMedia('(display-mode: standalone)').matches ||
              window.matchMedia('(display-mode: fullscreen)').matches));
        if (!standalone) return;
        var dest = '/mobile/' + (location.search || '') + (location.hash || '');
        location.replace(dest);
      } catch (e) {}
    })();
  </script>
  <!-- Route-level SEO is managed by react-helmet-async and prerender output. Keep the shell head minimal to avoid stale duplicate tags. -->
  <title>AstroRoshni</title>
  <!-- Google tag (gtag.js): load after first paint / idle to reduce main-thread contention with React -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    function loadGtag() {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-M0C9B8LGMR';
      s.onload = function () {
        gtag('js', new Date());
        gtag('config', 'G-M0C9B8LGMR');
      };
      document.head.appendChild(s);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGtag, { timeout: 4000 });
    } else {
      window.addEventListener('load', loadGtag);
    }
  </script>
  <!-- Meta Pixel (marketing website). PWA at /mobile/ has its own snippet with ar_surface=pwa. -->
  <script>
    !(function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = '2.0';
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1900398174159684');
    fbq('track', 'PageView', { ar_surface: 'website', content_name: 'website_shell' });
    fbq('trackCustom', 'Website_PageView', { ar_surface: 'website', content_name: 'website_shell' });
    window.__AR_META_PIXEL_WEBSITE_INIT__ = true;
  </script>
  <noscript
    ><img
      height="1"
      width="1"
      style="display: none"
      src="https://www.facebook.com/tr?id=1900398174159684&ev=PageView&noscript=1"
      alt=""
  /></noscript>
  
</head>
<body>
  <div id="root"></div>
</body>
</html>
