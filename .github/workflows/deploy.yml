  finalize_app_deploy:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') }}
    needs:
      - backend_and_chat_live
      - backend_rollout_image
      - reel_worker
      - detect_changes
      - payment_service
      - nudge_services
      - frontend
      - mobile_web
    runs-on: ubuntu-latest
    steps:
      - name: Final public site health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://astroroshni.com/api/health" >/dev/null
          curl -fsS --max-time 20 "https://astroroshni.com/" >/dev/null
          # Expo Web entry at /mobile (CRA remains on / for all devices, including phones)
          curl -fsS --max-time 20 -o /dev/null -w "%{http_code}\n" "https://astroroshni.com/mobile/" || true
          curl -fsS --max-time 20 -o /dev/null -w "%{http_code}\n" "https://astroroshni.com/mobile/index.html" || true

  replace_vms:
    # Uses the existing baked templates; does not reset/restart all new VMs again.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'replace_vms' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Rolling VM replacement with spare capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "========== GitHub Actions: MIG replacement start $(date -u '+%Y-%m-%d %H:%M:%S UTC') =========="
          gcloud config set project "${GCP_PROJECT_ID}"

          python3 scripts/deploy_mig.py replace \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_API_MIG_NAME}" --zone "${GCP_API_MIG_ZONE}" \
            --backend-service astrology-backend-mig-service
          python3 scripts/deploy_mig.py replace \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_CHAT_WORKER_MIG_NAME}" --zone "${GCP_CHAT_WORKER_MIG_ZONE}" \
            --backend-service astrology-chat-worker-service
          echo "========== GitHub Actions: MIG replacement end   $(date -u '+%Y-%m-%d %H:%M:%S UTC') =========="
