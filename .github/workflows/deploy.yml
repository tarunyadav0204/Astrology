name: Deploy to GCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional commit SHA, tag, or branch to deploy instead of the latest main"
        required: false
        default: ""
        type: string
      deployment_mode:
        description: "app = run deploy.sh on existing VMs; replace_vms = recreate MIG VMs"
        required: true
        default: app
        type: choice
        options:
          - app
          - replace_vms
      force_backend_pip:
        description: "Run pip install even if requirements.txt did not change"
        required: false
        default: false
        type: boolean
      force_frontend_deploy:
        description: "Force frontend rebuild/restart"
        required: false
        default: false
        type: boolean
      force_full_deploy:
        description: "Force full backend/frontend dependency setup and rebuild"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-prod-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  CLOUDSDK_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_API_MIG_NAME: astroroshni-mig-s2b
  GCP_API_MIG_ZONE: asia-south2-b
  GCP_CHAT_WORKER_MIG_NAME: astroroshni-chat-worker-mig
  GCP_CHAT_WORKER_MIG_ZONE: asia-south2-b
  GCP_PLAY_PAYMENT_SERVICE_NAME: astroroshni-play-payment-service
  GCP_PLAY_PAYMENT_SERVICE_REGION: asia-south2
  GCP_NUDGE_DISPATCH_SERVICE_NAME: astroroshni-nudge-dispatch
  GCP_NUDGE_WORKER_SERVICE_NAME: astroroshni-nudge-worker
  GCP_NUDGE_SERVICE_REGION: asia-south1
  GCP_REEL_WORKER_SERVICE_NAME: astroroshni-reel-worker
  GCP_REEL_WORKER_SERVICE_REGION: asia-south2
  GCP_API_BACKEND_MACHINE_TYPE: e2-standard-4
  GCP_CHAT_WORKER_MACHINE_TYPE: e2-standard-4
  GCP_IMAGE_BUILDER_MACHINE_TYPE: ${{ vars.GCP_IMAGE_BUILDER_MACHINE_TYPE || 'e2-standard-4' }}

jobs:
  detect_changes:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      backend_required: ${{ steps.detect.outputs.backend_required }}
      payment_required: ${{ steps.detect.outputs.payment_required }}
      nudge_required: ${{ steps.detect.outputs.nudge_required }}
      reel_worker_required: ${{ steps.detect.outputs.reel_worker_required }}
      frontend_required: ${{ steps.detect.outputs.frontend_required }}
      mobile_web_required: ${{ steps.detect.outputs.mobile_web_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Detect deploy target changes
        id: detect
        shell: bash
        env:
          FORCE_BACKEND_PIP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_backend_pip || false }}
          FORCE_FRONTEND_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_frontend_deploy || false }}
          FORCE_FULL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_deploy || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "source_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          # Pending runs may be coalesced by concurrency. Include changes from
          # skipped/failed pushes, not just the final push's immediate parent.
          baseline=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            baseline="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f branch=main -f event=push -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty')"
          fi
          if [[ -n "${baseline}" ]] && git merge-base --is-ancestor "${baseline}" HEAD; then
            changed_files="$(git diff --name-only "${baseline}" HEAD)"
          else
            # First deploy, manual rollback/ref, or unavailable history: deploy all.
            changed_files="$(git ls-files)"
          fi

          echo "Changed files:"
          printf '%s\n' "${changed_files}"

          backend_required=false
          payment_required=false
          nudge_required=false
          reel_worker_required=false
          frontend_required=false
          mobile_web_required=false

          if [[ "${FORCE_FULL_DEPLOY}" == "true" ]]; then
            backend_required=true
            payment_required=true
            nudge_required=true
            reel_worker_required=true
            frontend_required=true
            mobile_web_required=true
          else
            if [[ "${FORCE_BACKEND_PIP}" == "true" ]]; then
              backend_required=true
            fi

            if [[ "${FORCE_FRONTEND_DEPLOY}" == "true" ]]; then
              frontend_required=true
              mobile_web_required=true
            fi

            # Prefix patterns must not use a trailing `$` after `backend/` / `play_payment_service/`
            # or only the exact directory path would match (never files under it).
            if printf '%s\n' "${changed_files}" | grep -E -q \
              '^backend/|^deploy\.sh$|^scripts/(check_backend_syntax|deploy_mig)\.py$|^scripts/(deploy-release|build-gce-release-image|prepare-image-release|bootstrap-runtime|gce-startup-bootstrap|install_runtime_watchdog|compile_knowledge_graph_runtime)\.sh$|^\.github/workflows/deploy\.yml$'; then
              backend_required=true
            fi

            if printf '%s\n' "${changed_files}" | grep -E -q \
              '^play_payment_service/|^backend/credits/|^backend/activity/|^backend/utils/admin_settings\.py$|^backend/utils/birth_hash\.py$|^backend/utils/env_json\.py$|^backend/auth\.py$|^backend/db\.py$|^scripts/prepare-play-payment-build-context\.sh$'; then
              payment_required=true
            fi

            if printf '%s\n' "${changed_files}" | grep -E -q \
              '^nudge_worker_service/|^nudge_dispatch_service/|^backend/|^scripts/prepare-nudge-service-build-context\.sh$'; then
              nudge_required=true
            fi

            if printf '%s\n' "${changed_files}" | grep -E -q \
              '^reel_worker_service/|^backend/reel_studio/|^scripts/prepare-reel-worker-build-context\.sh$|^\.github/workflows/deploy\.yml$'; then
              reel_worker_required=true
            fi

            if printf '%s\n' "${changed_files}" | grep -E -q '^frontend/|^frontend-next/'; then
              frontend_required=true
            fi

            if printf '%s\n' "${changed_files}" | grep -E -q \
              '^astroroshni_mobile/|^infra/ua-edge-router/'; then
              mobile_web_required=true
            fi
          fi

          echo "backend_required=${backend_required}" >> "${GITHUB_OUTPUT}"
          echo "payment_required=${payment_required}" >> "${GITHUB_OUTPUT}"
          echo "nudge_required=${nudge_required}" >> "${GITHUB_OUTPUT}"
          echo "reel_worker_required=${reel_worker_required}" >> "${GITHUB_OUTPUT}"
          echo "frontend_required=${frontend_required}" >> "${GITHUB_OUTPUT}"
          echo "mobile_web_required=${mobile_web_required}" >> "${GITHUB_OUTPUT}"

  backend_and_chat_live:
    name: Backend & Chat — Live Deployment
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.backend_required == 'true' }}
    needs: [detect_changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Load deployment safeguards from the workflow commit
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${TOOLING_COMMIT}"
          mkdir -p "${RUNNER_TEMP}/deploy-tools/tests"
          for file in deploy_mig.py deploy-release.sh gce-startup-bootstrap.sh tests/test_deploy_mig.py; do
            git show "${TOOLING_COMMIT}:scripts/${file}" > "${RUNNER_TEMP}/deploy-tools/${file}"
          done

      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate backend Python syntax
        run: python scripts/check_backend_syntax.py backend

      - name: Test deployment failure and rollback safeguards
        run: |
          python -m unittest discover -s "${RUNNER_TEMP}/deploy-tools/tests" -v
          bash -n "${RUNNER_TEMP}/deploy-tools/deploy-release.sh" "${RUNNER_TEMP}/deploy-tools/gce-startup-bootstrap.sh"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Rolling API and chat-worker deploy on current MIG VMs
        env:
          FORCE_BACKEND_PIP: ${{ github.event_name == 'workflow_dispatch' && inputs.force_backend_pip || false }}
          FORCE_FRONTEND_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_frontend_deploy || false }}
          FORCE_FULL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_deploy || false }}
          FRONTEND_ARTIFACT_REQUIRED: 'false'
          SERVE_FRONTEND_LOCALLY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "========== GitHub Actions: rolling app deploy start $(date -u '+%Y-%m-%d %H:%M:%S UTC') =========="
          gcloud config set project "${GCP_PROJECT_ID}"

          COMMIT="$(git rev-parse HEAD)"
          python3 "${RUNNER_TEMP}/deploy-tools/deploy_mig.py" live \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_API_MIG_NAME}" --zone "${GCP_API_MIG_ZONE}" \
            --backend-service astrology-backend-mig-service --commit "${COMMIT}"
          python3 "${RUNNER_TEMP}/deploy-tools/deploy_mig.py" live \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_CHAT_WORKER_MIG_NAME}" --zone "${GCP_CHAT_WORKER_MIG_ZONE}" \
            --backend-service astrology-chat-worker-service --commit "${COMMIT}"
          echo "========== GitHub Actions: rolling app deploy end   $(date -u '+%Y-%m-%d %H:%M:%S UTC') =========="

      - name: Mark backend ready for testing
        shell: bash
        run: |
          {
            echo "## ✅ Backend and chat deployment is live"
            echo
            echo "- API and chat-worker MIG instances were updated."
            echo "- Instance-local health checks passed."
            echo "- Public API health check passed."
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "The backend is ready for testing. Release-image preparation continues in a separate job."
          } >> "${GITHUB_STEP_SUMMARY}"

  backend_rollout_image:
    name: Backend Image — Future VM Rollouts
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.backend_required == 'true' && needs.backend_and_chat_live.result == 'success' }}
    needs: [detect_changes, backend_and_chat_live]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Load deployment safeguards from the workflow commit
        env:
          TOOLING_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${TOOLING_COMMIT}"
          mkdir -p "${RUNNER_TEMP}/deploy-tools/tests"
          for file in deploy_mig.py deploy-release.sh gce-startup-bootstrap.sh tests/test_deploy_mig.py; do
            git show "${TOOLING_COMMIT}:scripts/${file}" > "${RUNNER_TEMP}/deploy-tools/${file}"
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build baked backend release image
        id: baked_image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_NAME="astroroshni-release-backend-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          ACTIVE_TEMPLATE="$(gcloud compute instance-groups managed describe "${GCP_API_MIG_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_API_MIG_ZONE}" \
            --format='value(instanceTemplate.basename())')"
          BASE_IMAGE="$(gcloud compute instance-templates describe "${ACTIVE_TEMPLATE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(properties.disks[0].initializeParams.sourceImage.basename())')"
          test -n "${BASE_IMAGE}"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          APP_ROOT="${GITHUB_WORKSPACE}" \
          GCLOUD_BIN="gcloud" \
          GCLOUD_CONFIG="${CLOUDSDK_CONFIG:-}" \
          PROJECT_ID="${GCP_PROJECT_ID}" \
          ZONE="${GCP_API_MIG_ZONE}" \
          MACHINE_TYPE="${GCP_IMAGE_BUILDER_MACHINE_TYPE}" \
          BASE_IMAGE="${BASE_IMAGE}" \
          BASE_IMAGE_PROJECT="${GCP_PROJECT_ID}" \
          IMAGE_NAME="${IMAGE_NAME}" \
          IMAGE_FAMILY="astroroshni-release-backend" \
          STORAGE_LOCATION="asia-south2" \
          KEEP_BUILDER_VM="false" \
          SERVE_FRONTEND_LOCALLY="false" \
          INSTALL_GCP_OPS_AGENT="false" \
          bash "${GITHUB_WORKSPACE}/scripts/build-gce-release-image.sh"

      - name: Refresh API MIG baked-image template for future replacements
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TEMPLATE_NAME="astro-baked-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          SUBNET_REGION="${GCP_API_MIG_ZONE%-*}"
          SUBNET_SELF_LINK="projects/${GCP_PROJECT_ID}/regions/${SUBNET_REGION}/subnetworks/default"

          gcloud compute instance-templates create "${TEMPLATE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --machine-type="${GCP_API_BACKEND_MACHINE_TYPE}" \
            --network=default \
            --subnet="${SUBNET_SELF_LINK}" \
            --no-address \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account="800681558445-compute@developer.gserviceaccount.com" \
            --scopes="https://www.googleapis.com/auth/cloud-platform" \
            --tags="web-server" \
            --image="${{ steps.baked_image.outputs.image_name }}" \
            --image-project="${GCP_PROJECT_ID}" \
            --metadata-from-file="startup-script=${RUNNER_TEMP}/deploy-tools/gce-startup-bootstrap.sh"

          python3 "${RUNNER_TEMP}/deploy-tools/deploy_mig.py" template \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_API_MIG_NAME}" --zone "${GCP_API_MIG_ZONE}" \
            --backend-service astrology-backend-mig-service --template "${TEMPLATE_NAME}"

      - name: Refresh chat worker MIG baked-image template for future replacements
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TEMPLATE_NAME="astro-chat-worker-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          SUBNET_REGION="${GCP_CHAT_WORKER_MIG_ZONE%-*}"
          SUBNET_SELF_LINK="projects/${GCP_PROJECT_ID}/regions/${SUBNET_REGION}/subnetworks/default"

          gcloud compute instance-templates create "${TEMPLATE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --machine-type="${GCP_CHAT_WORKER_MACHINE_TYPE}" \
            --network=default \
            --subnet="${SUBNET_SELF_LINK}" \
            --no-address \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account="800681558445-compute@developer.gserviceaccount.com" \
            --scopes="https://www.googleapis.com/auth/cloud-platform" \
            --tags="web-server" \
            --image="${{ steps.baked_image.outputs.image_name }}" \
            --image-project="${GCP_PROJECT_ID}" \
            --metadata-from-file="startup-script=${RUNNER_TEMP}/deploy-tools/gce-startup-bootstrap.sh"

          python3 "${RUNNER_TEMP}/deploy-tools/deploy_mig.py" template \
            --project "${GCP_PROJECT_ID}" --mig "${GCP_CHAT_WORKER_MIG_NAME}" --zone "${GCP_CHAT_WORKER_MIG_ZONE}" \
            --backend-service astrology-chat-worker-service --template "${TEMPLATE_NAME}"

      - name: Prune obsolete release templates and images
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/cleanup-production-release-artifacts.sh" \
            --apply \
            --project "${GCP_PROJECT_ID}" \
            --keep-vm-images 20 \
            --keep-container-images 15 \
            --container-max-age-days 30

  payment_service:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.payment_required == 'true' }}
    needs: [detect_changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build play payment service image
        id: play_payment_image
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY_REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'asia-south2' }}
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run/play-payment-service:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          PAYMENT_BUILD_DIR="${RUNNER_TEMP}/play-payment-build-context"
          bash "${GITHUB_WORKSPACE}/scripts/prepare-play-payment-build-context.sh" "${PAYMENT_BUILD_DIR}"
          du -sh "${PAYMENT_BUILD_DIR}" || true
          gcloud builds submit "${PAYMENT_BUILD_DIR}" \
            --project "${GCP_PROJECT_ID}" \
            --config play_payment_service/cloudbuild.yaml \
            --substitutions "_IMAGE_URI=${IMAGE_URI}"

      - name: Deploy play payment service to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_PLAY_PAYMENT_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_PLAY_PAYMENT_SERVICE_REGION}" \
            --image "${{ steps.play_payment_image.outputs.image_uri }}" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --service-account "800681558445-compute@developer.gserviceaccount.com" \
            --execution-environment gen2 \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 8 \
            --timeout 60 \
            --min-instances 1 \
            --max-instances 10 \
            --port 8080 \
            --set-env-vars "PLAY_PAYMENT_SERVICE_ENV=production,PLAY_PAYMENT_SERVICE_ENV_FILE=/secrets/app_env/.env,GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --update-secrets "/secrets/app_env/.env=APP_ENV_FILE:latest,PLAY_PAYMENT_SERVICE_SHARED_SECRET=PLAY_PAYMENT_SERVICE_SHARED_SECRET:latest"

  nudge_services:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.nudge_required == 'true' }}
    needs: [detect_changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build nudge worker service image
        id: nudge_worker_image
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY_REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'asia-south2' }}
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run/nudge-worker:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          BUILD_DIR="${RUNNER_TEMP}/nudge-worker-build-context"
          bash "${GITHUB_WORKSPACE}/scripts/prepare-nudge-service-build-context.sh" "nudge_worker_service" "${BUILD_DIR}"
          gcloud builds submit "${BUILD_DIR}" \
            --project "${GCP_PROJECT_ID}" \
            --config nudge_worker_service/cloudbuild.yaml \
            --substitutions "_IMAGE_URI=${IMAGE_URI}"

      - name: Ensure isolated notification queues
        shell: bash
        run: |
          set -euo pipefail
          for QUEUE in nudge-standard-queue nudge-campaign-queue nudge-email-queue; do
            if ! gcloud tasks queues describe "${QUEUE}" --project "${GCP_PROJECT_ID}" --location asia-south1 >/dev/null 2>&1; then
              gcloud tasks queues create "${QUEUE}" --project "${GCP_PROJECT_ID}" --location asia-south1
            fi
            gcloud tasks queues update "${QUEUE}" \
              --project "${GCP_PROJECT_ID}" \
              --location asia-south1 \
              --max-attempts 8 \
              --min-backoff 10s \
              --max-backoff 300s \
              --max-concurrent-dispatches 40 \
              --max-dispatches-per-second 20
          done
          if ! gcloud tasks queues describe nudge-kp-daily-queue --project "${GCP_PROJECT_ID}" --location asia-south1 >/dev/null 2>&1; then
            gcloud tasks queues create nudge-kp-daily-queue --project "${GCP_PROJECT_ID}" --location asia-south1
          fi
          gcloud tasks queues update nudge-kp-daily-queue \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --max-attempts 5 \
            --min-backoff 30s \
            --max-backoff 600s \
            --max-concurrent-dispatches 2 \
            --max-dispatches-per-second 1
          if ! gcloud tasks queues describe nudge-moon-tara-queue --project "${GCP_PROJECT_ID}" --location asia-south1 >/dev/null 2>&1; then
            gcloud tasks queues create nudge-moon-tara-queue --project "${GCP_PROJECT_ID}" --location asia-south1
          fi
          gcloud tasks queues update nudge-moon-tara-queue \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --max-attempts 5 \
            --min-backoff 20s \
            --max-backoff 300s \
            --max-concurrent-dispatches 10 \
            --max-dispatches-per-second 5
          for QUEUE in nudge-whatsapp-campaign-queue nudge-sms-campaign-queue; do
          if ! gcloud tasks queues describe "${QUEUE}" --project "${GCP_PROJECT_ID}" --location asia-south1 >/dev/null 2>&1; then
            gcloud tasks queues create "${QUEUE}" --project "${GCP_PROJECT_ID}" --location asia-south1
          fi
          gcloud tasks queues update "${QUEUE}" \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --max-attempts 8 \
            --min-backoff 15s \
            --max-backoff 300s \
            --max-concurrent-dispatches 5 \
            --max-dispatches-per-second 5
          done

      - name: Deploy nudge worker service to Cloud Run
        id: deploy_nudge_worker_service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_NUDGE_WORKER_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_NUDGE_SERVICE_REGION}" \
            --image "${{ steps.nudge_worker_image.outputs.image_uri }}" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --service-account "800681558445-compute@developer.gserviceaccount.com" \
            --execution-environment gen2 \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 8 \
            --timeout 900 \
            --min-instances 0 \
            --max-instances 50 \
            --port 8080 \
            --set-env-vars "NUDGE_SERVICE_ROLE=worker,NUDGE_REQUIRE_ISOLATED_DATABASES=true,NUDGE_SERVICE_ENV_FILE=/secrets/app_env/.env,GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GCP_PROJECT_ID=${GCP_PROJECT_ID},PUBLIC_API_BASE_URL=https://astroroshni.com,NUDGE_KP_DAILY_TASKS_QUEUE=nudge-kp-daily-queue,NUDGE_MOON_TARA_TASKS_QUEUE=nudge-moon-tara-queue,NUDGE_EMAIL_TASKS_QUEUE=nudge-email-queue,NUDGE_WHATSAPP_TASKS_QUEUE=nudge-whatsapp-campaign-queue,NUDGE_SMS_TASKS_QUEUE=nudge-sms-campaign-queue" \
            --update-secrets "/secrets/app_env/.env=APP_ENV_FILE:latest,NUDGE_CRON_SECRET=NUDGE_CRON_SECRET:latest,NUDGE_TASKS_SECRET=NUDGE_TASKS_SECRET:latest,NUDGE_AUDIENCE_DATABASE_URL=NUDGE_AUDIENCE_DATABASE_URL:latest,NUDGE_NOTIFICATION_DATABASE_URL=NUDGE_NOTIFICATION_DATABASE_URL:latest"

          SERVICE_URL="$(gcloud run services describe "${GCP_NUDGE_WORKER_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_NUDGE_SERVICE_REGION}" \
            --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build nudge dispatch service image
        id: nudge_dispatch_image
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY_REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'asia-south2' }}
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run/nudge-dispatch:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          BUILD_DIR="${RUNNER_TEMP}/nudge-dispatch-build-context"
          bash "${GITHUB_WORKSPACE}/scripts/prepare-nudge-service-build-context.sh" "nudge_dispatch_service" "${BUILD_DIR}"
          gcloud builds submit "${BUILD_DIR}" \
            --project "${GCP_PROJECT_ID}" \
            --config nudge_dispatch_service/cloudbuild.yaml \
            --substitutions "_IMAGE_URI=${IMAGE_URI}"

      - name: Deploy nudge dispatch service to Cloud Run
        id: deploy_nudge_dispatch_service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${GCP_NUDGE_DISPATCH_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_NUDGE_SERVICE_REGION}" \
            --image "${{ steps.nudge_dispatch_image.outputs.image_uri }}" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --service-account "800681558445-compute@developer.gserviceaccount.com" \
            --execution-environment gen2 \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 4 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 5 \
            --port 8080 \
            --set-env-vars "NUDGE_SERVICE_ROLE=dispatch,NUDGE_REQUIRE_ISOLATED_DATABASES=true,NUDGE_SERVICE_ENV_FILE=/secrets/app_env/.env,GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GCP_PROJECT_ID=${GCP_PROJECT_ID},PUBLIC_API_BASE_URL=https://astroroshni.com,NUDGE_TASKS_TARGET_BASE_URL=${{ steps.deploy_nudge_worker_service.outputs.service_url }},NUDGE_KP_DAILY_TASKS_QUEUE=nudge-kp-daily-queue,NUDGE_MOON_TARA_TASKS_QUEUE=nudge-moon-tara-queue,NUDGE_EMAIL_TASKS_QUEUE=nudge-email-queue" \
            --update-secrets "/secrets/app_env/.env=APP_ENV_FILE:latest,NUDGE_CRON_SECRET=NUDGE_CRON_SECRET:latest,NUDGE_TASKS_SECRET=NUDGE_TASKS_SECRET:latest,NUDGE_AUDIENCE_DATABASE_URL=NUDGE_AUDIENCE_DATABASE_URL:latest,NUDGE_NOTIFICATION_DATABASE_URL=NUDGE_NOTIFICATION_DATABASE_URL:latest"

          SERVICE_URL="$(gcloud run services describe "${GCP_NUDGE_DISPATCH_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_NUDGE_SERVICE_REGION}" \
            --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Repoint nudge scheduler jobs to nudge dispatch service
        shell: bash
        run: |
          set -euo pipefail
          DISPATCH_URL="${{ steps.deploy_nudge_dispatch_service.outputs.service_url }}"
          CRON_SECRET="$(gcloud secrets versions access latest --secret=NUDGE_CRON_SECRET --project "${GCP_PROJECT_ID}" | tr -d '\r\n')"
          gcloud scheduler jobs update http nudge-campaign-dispatch \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --uri "${DISPATCH_URL}/api/nudge/cron/campaign/dispatch-due?limit=20" \
            --http-method POST \
            --update-headers "X-Cron-Secret=${CRON_SECRET}"
          gcloud scheduler jobs update http astroroshni-broadcast-dispatch-due \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --uri "${DISPATCH_URL}/api/nudge/cron/broadcast/dispatch-due?limit=100" \
            --http-method POST \
            --update-headers "X-Cron-Secret=${CRON_SECRET}"
          gcloud scheduler jobs update http astroroshni-chat-followup-hourly \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --uri "${DISPATCH_URL}/api/nudge/cron/chat-followup/dispatch-recent?limit_users=200&lookback_minutes=60" \
            --http-method POST \
            --update-headers "X-Cron-Secret=${CRON_SECRET}"
          gcloud scheduler jobs update http astroroshni-nudge-scan-daily \
            --project "${GCP_PROJECT_ID}" \
            --location asia-south1 \
            --uri "${DISPATCH_URL}/api/nudge/scan" \
            --http-method POST \
            --update-headers "X-Cron-Secret=${CRON_SECRET}"

          upsert_engagement_job() {
            local job_name="$1"
            local schedule="$2"
            local uri="$3"
            if gcloud scheduler jobs describe "${job_name}" --project "${GCP_PROJECT_ID}" --location asia-south1 >/dev/null 2>&1; then
              gcloud scheduler jobs update http "${job_name}" \
                --project "${GCP_PROJECT_ID}" --location asia-south1 \
                --schedule "${schedule}" --time-zone UTC --uri "${uri}" \
                --http-method POST --update-headers "X-Cron-Secret=${CRON_SECRET}"
            else
              gcloud scheduler jobs create http "${job_name}" \
                --project "${GCP_PROJECT_ID}" --location asia-south1 \
                --schedule "${schedule}" --time-zone UTC --uri "${uri}" \
                --http-method POST --headers "X-Cron-Secret=${CRON_SECRET}"
            fi
          }
          upsert_engagement_job astroroshni-engagement-repair "*/15 * * * *" \
            "${DISPATCH_URL}/api/engagement-suggestions/cron/repair?lookback_hours=48&limit=1000"
          upsert_engagement_job astroroshni-engagement-refresh-queue "7 * * * *" \
            "${DISPATCH_URL}/api/engagement-suggestions/cron/schedule-notification-refreshes?limit=500"
          upsert_engagement_job astroroshni-engagement-process-due "*/5 * * * *" \
            "${DISPATCH_URL}/api/engagement-suggestions/cron/process-due?limit=2"
          upsert_engagement_job astroroshni-kp-daily "30 1 * * *" \
            "${DISPATCH_URL}/api/nudge/cron/kp-daily"
          upsert_engagement_job astroroshni-moon-tara-daily "0 3 * * *" \
            "${DISPATCH_URL}/api/nudge/cron/moon-tara-daily"

  reel_worker:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.reel_worker_required == 'true' }}
    needs: [detect_changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build dedicated Reel worker image
        id: reel_worker_image
        shell: bash
        env:
          GCP_ARTIFACT_REGISTRY_REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'asia-south2' }}
        run: |
          set -euo pipefail
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run/reel-worker:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          BUILD_DIR="${RUNNER_TEMP}/reel-worker-build-context"
          bash "${GITHUB_WORKSPACE}/scripts/prepare-reel-worker-build-context.sh" "${BUILD_DIR}"
          gcloud builds submit "${BUILD_DIR}" \
            --project "${GCP_PROJECT_ID}" \
            --config reel_worker_service/cloudbuild.yaml \
            --substitutions "_IMAGE_URI=${IMAGE_URI}"

      - name: Create the durable Reel queue
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud tasks queues describe reel-render-queue --project "${GCP_PROJECT_ID}" --location "${GCP_REEL_WORKER_SERVICE_REGION}" >/dev/null 2>&1; then
            gcloud tasks queues create reel-render-queue --project "${GCP_PROJECT_ID}" --location "${GCP_REEL_WORKER_SERVICE_REGION}"
          fi
          gcloud tasks queues update reel-render-queue \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REEL_WORKER_SERVICE_REGION}" \
            --max-attempts 5 --min-backoff 30s --max-backoff 600s \
            --max-concurrent-dispatches 2 --max-dispatches-per-second 1

      - name: Deploy and register dedicated Reel worker
        shell: bash
        run: |
          set -euo pipefail
          # The URL is known only after the first Cloud Run deployment. A
          # second lightweight revision receives it and registers it in the
          # application database during startup.
          gcloud run deploy "${GCP_REEL_WORKER_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REEL_WORKER_SERVICE_REGION}" \
            --image "${{ steps.reel_worker_image.outputs.image_uri }}" \
            --platform managed --allow-unauthenticated --ingress all \
            --service-account "800681558445-compute@developer.gserviceaccount.com" \
            --execution-environment gen2 --network default --subnet default \
            --vpc-egress private-ranges-only --cpu 4 --memory 4Gi \
            --concurrency 1 --timeout 1800 --min-instances 0 --max-instances 3 --port 8080 \
            --set-env-vars "REEL_WORKER_ENV_FILE=/secrets/app_env/.env,GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GCP_PROJECT_ID=${GCP_PROJECT_ID},REEL_WORKER_PUBLIC_URL=https://placeholder.invalid,REEL_BRAND_LOGO_PATH=/app/assets/logo.png,REEL_TTS_CONCURRENCY=6,REEL_IMAGE_CONCURRENCY=4,REEL_CLIP_CONCURRENCY=4" \
            --update-secrets "/secrets/app_env/.env=APP_ENV_FILE:latest,REEL_TASKS_SECRET=NUDGE_TASKS_SECRET:latest"
          SERVICE_URL="$(gcloud run services describe "${GCP_REEL_WORKER_SERVICE_NAME}" --project "${GCP_PROJECT_ID}" --region "${GCP_REEL_WORKER_SERVICE_REGION}" --format='value(status.url)')"
          gcloud run services update "${GCP_REEL_WORKER_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REEL_WORKER_SERVICE_REGION}" \
            --update-env-vars "REEL_WORKER_PUBLIC_URL=${SERVICE_URL}"
          # Cloud Tasks carries the private shared secret to the worker. Keep
          # Cloud Run invokable so it can deliver that request; some existing
          # services have an empty IAM policy despite --allow-unauthenticated
          # on deploy, which otherwise leaves paid jobs queued forever.
          gcloud run services add-iam-policy-binding "${GCP_REEL_WORKER_SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REEL_WORKER_SERVICE_REGION}" \
            --member="allUsers" --role="roles/run.invoker"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 20 "${SERVICE_URL}/" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Reel worker failed its registration health check"
          exit 1

  frontend:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deployment_mode == 'app') && needs.detect_changes.outputs.frontend_required == 'true' }}
    needs: [detect_changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.source_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-next/package-lock.json

      - name: Build frontend artifact once
        shell: bash
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
          INLINE_RUNTIME_CHUNK: 'true'
          PRERENDER: 'true'
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend-next ci
          unset PRERENDER_ROUTES
          SITEMAP_URL="https://astroroshni.com/sitemap.xml" \
          BLOG_API_URL="https://astroroshni.com" \
          npm --prefix frontend run build:ci
          tar -czf "${RUNNER_TEMP}/frontend-build-${GITHUB_SHA}.tgz" -C frontend build

      - name: Publish frontend artifact to GCS
        shell: bash
        env:
          GCP_FRONTEND_ARTIFACT_BUCKET: ${{ vars.GCP_FRONTEND_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${GCP_FRONTEND_ARTIFACT_BUCKET}" ]]; then
            echo "❌ GCP_FRONTEND_ARTIFACT_BUCKET GitHub variable is required to publish frontend artifacts"
            exit 1
          fi
          gcloud config set project "${GCP_PROJECT_ID}"
          VERSIONED_URI="gs://${GCP_FRONTEND_ARTIFACT_BUCKET}/prod/frontend-build-${GITHUB_SHA}.tgz"
          LATEST_URI="gs://${GCP_FRONTEND_ARTIFACT_BUCKET}/prod/frontend-build-latest.tgz"
          gcloud storage cp "${RUNNER_TEMP}/frontend-build-${GITHUB_SHA}.tgz" "${VERSIONED_URI}"
          gcloud storage cp "${RUNNER_TEMP}/frontend-build-${GITHUB_SHA}.tgz" "${LATEST_URI}"

      - name: Publish frontend site build to GCS
        if: ${{ vars.GCP_FRONTEND_SITE_BUCKET != '' }}
        shell: bash
        env:
          GCP_FRONTEND_SITE_BUCKET: ${{ vars.GCP_FRONTEND_SITE_BUCKET }}
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"
          # Exclude Expo Web PWA paths from rsync -d. Without this, a CRA-only deploy
          # deletes /mobile/, /_expo/, and Expo /assets from the shared site bucket
          # (users then see the 404 maintenance page at /mobile/).
          gsutil -m rsync -r -d \
            -x '^(mobile(/.*)?|_expo(/.*)?|expo-index\.html|assets/(node_modules|src|assets)(/.*)?)$' \
            frontend/build "gs://${GCP_FRONTEND_SITE_BUCKET}"
          gsutil -m setmeta -h "Cache-Control:no-cache" "gs://${GCP_FRONTEND_SITE_BUCKET}/**/*.html" || true
          # The load balancer may serve this document for a transient 5xx. Never
          # let an installed PWA retain that response as its next launch page.
          gsutil setmeta -h "Cache-Control:no-store, max-age=0, must-revalidate" "gs://${GCP_FRONTEND_SITE_BUCKET}/maintenance.html" || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" "gs://${GCP_FRONTEND_SITE_BUCKET}/static/**" || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" "gs://${GCP_FRONTEND_SITE_BUCKET}/_next/static/**" || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" "gs://${GCP_FRONTEND_SITE_BUCKET}/manifest.json" || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" "gs://${GCP_FRONTEND_SITE_BUCKET}/robots.txt" || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=3600" "gs://${GCP_FRONTEND_SITE_BUCKET}/sitemap.xml" || true

  mobile_web:
